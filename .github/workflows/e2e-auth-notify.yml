name: DDS production auth notification E2E

on:
  push:
    branches:
      - run/dds-e2e-auth-notify-test
    paths:
      - ".github/workflows/e2e-auth-notify.yml"

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/dds-e2e-auth-notify-test

      - name: Exercise production registration and login
        shell: bash
        run: |
          set +e
          EMAIL="dds.qa.${GITHUB_RUN_ID}@example.com"
          PHONE="15550000000"
          PASSWORD="$(openssl rand -hex 16)"

          REGISTER_CODE=$(curl -sS -o /tmp/register.json -w "%{http_code}"             -X POST "https://dds-venezuela-portal.vercel.app/api/auth/register"             -H "content-type: application/json"             --data "{"email":"$EMAIL","phone":"$PHONE","password":"$PASSWORD","confirmPassword":"$PASSWORD"}")

          LOGIN_CODE=$(curl -sS -o /tmp/login.json -w "%{http_code}"             -X POST "https://dds-venezuela-portal.vercel.app/api/auth/login"             -H "content-type: application/json"             --data "{"email":"$EMAIL","password":"$PASSWORD"}")

          STATUS_CODE=$(curl -sS -o /tmp/status.json -w "%{http_code}"             "https://dds-venezuela-portal.vercel.app/api/ops/notification-status")

          {
            echo "email=$EMAIL"
            echo "register_http=$REGISTER_CODE"
            echo -n "register_body="; cat /tmp/register.json; echo
            echo "login_http=$LOGIN_CODE"
            echo -n "login_body="; cat /tmp/login.json; echo
            echo "notification_status_http=$STATUS_CODE"
            echo -n "notification_status_body="; cat /tmp/status.json; echo
          } > e2e-auth-notify-result.txt

          git config user.name "DDS E2E Bot"
          git config user.email "actions@users.noreply.github.com"
          git add e2e-auth-notify-result.txt
          git commit -m "test: record valid production auth E2E result" || true
          git push
