name: DDS-VEN CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - run/dds-dr-nav-preview-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Governance configuration gate
        run: npm run governance:check

      - name: Policy and source-boundary tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
