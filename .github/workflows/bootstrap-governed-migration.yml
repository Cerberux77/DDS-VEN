name: Governed DDS-VEN migration bootstrap

on:
  push:
    branches:
      - run/dds-dr-nav-preview-01
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-governed-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: run/dds-dr-nav-preview-01
          fetch-depth: 0

      - name: Wait until all migration chunks exist
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in .bootstrap/chunk_00 .bootstrap/chunk_01 .bootstrap/chunk_02 .bootstrap/chunk_03 .bootstrap/chunk_04; do
            if [ ! -f "$f" ]; then
              echo "Missing $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct governed candidate
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_* > /tmp/dds-ven-migration.b64
          base64 --decode /tmp/dds-ven-migration.b64 > /tmp/dds-ven-migration.tar.gz
          tar -xzf /tmp/dds-ven-migration.tar.gz -C .
          rm -rf .bootstrap

      - name: Use Node 22
        if: steps.chunks.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.chunks.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Policy and source-boundary tests
        if: steps.chunks.outputs.ready == 'true'
        run: npm test

      - name: Typecheck
        if: steps.chunks.outputs.ready == 'true'
        run: npm run typecheck

      - name: Production build
        if: steps.chunks.outputs.ready == 'true'
        run: npm run build

      - name: Commit verified migration
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oreshnik-governed-migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "feat: migrate and verify DDS controlled deal room"
          git push origin HEAD:run/dds-dr-nav-preview-01
