name: One-time generated artifact cleanup

on:
  push:
    branches:
      - run/dds-dr-nav-preview-01
    paths:
      - ".github/workflows/cleanup-generated.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: run/dds-dr-nav-preview-01
          fetch-depth: 0

      - name: Remove generated artifacts from repository
        shell: bash
        run: |
          set -euo pipefail

          cat > .gitignore <<'EOF'
          node_modules/
          .next/
          out/
          coverage/
          *.tsbuildinfo
          .env
          .env.local
          .env.*.local
          .DS_Store
          npm-debug.log*
          yarn-debug.log*
          yarn-error.log*
          pnpm-debug.log*
          EOF

          git rm -r --cached --ignore-unmatch node_modules .next out coverage
          git rm --cached --ignore-unmatch tsconfig.tsbuildinfo
          git rm --cached .github/workflows/cleanup-generated.yml

          git config user.name "oreshnik-governed-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add .gitignore
          git commit -m "chore: remove generated build artifacts from source control"
          git push origin HEAD:run/dds-dr-nav-preview-01
